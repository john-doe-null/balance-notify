
name: Comfly Balance Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comfly-balance-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check balance
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          NEW_API_USER: ${{ vars.NEW_API_USER }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WEWORK_WEBHOOK: ${{ secrets.WEWORK_WEBHOOK }}
          BALANCE_DIVISOR: ${{ vars.BALANCE_DIVISOR }}
          ALERT_THRESHOLD: ${{ vars.ALERT_THRESHOLD }}
          RECOVERY_THRESHOLD: ${{ vars.RECOVERY_THRESHOLD }}
          NIXIANGSHI_API_TOKEN: ${{ secrets.NIXIANGSHI_API_TOKEN }}
          NIXIANGSHI_ALERT_THRESHOLD: ${{ vars.NIXIANGSHI_ALERT_THRESHOLD }}
          NIXIANGSHI_RECOVERY_THRESHOLD: ${{ vars.NIXIANGSHI_RECOVERY_THRESHOLD }}
        run: python monitor.py

      - name: Save alert state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (
            git commit -m "Update balance alert state" &&
            git push
          )
